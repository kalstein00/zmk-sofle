# ZMK merges sofle_dongle.conf first, then this shield-specific fragment.
# Four PC bonds plus two split keyboard bonds. Only the selected PC may connect.
CONFIG_BT_MAX_CONN=6
CONFIG_BT_MAX_PAIRED=6
# The ATT request pool uses this count. Concurrent split discovery exhausted 5 slots.
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
# The status screen and the Bluetooth menu coexist in LVGL.
CONFIG_LV_Z_MEM_POOL_SIZE=12288
# A complete log dump fits in the CDC TX buffer, even before the host drains it.
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=24832

# DYA Studio runtime combo editing and persistence.
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=128
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=96
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
